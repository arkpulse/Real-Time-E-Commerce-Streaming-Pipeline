# =============================================================
# pytest configuration
# =============================================================

[pytest]
testpaths       = tests
python_files    = test_*.py
python_classes  = Test*
python_functions= test_*

markers =
    unit:        Unit tests (no AWS calls) — fast
    integration: Integration tests requiring LocalStack or real AWS

addopts =
    --tb=short
    -q
    --strict-markers

log_cli       = true
log_cli_level = WARNING
