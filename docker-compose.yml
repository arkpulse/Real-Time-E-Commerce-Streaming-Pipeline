version: "3.9"

# =============================================================
# Docker Compose: E-Commerce Streaming Pipeline
# =============================================================
# Orchestrates all local development services.
# Use .env file to configure AWS credentials and settings.
#
# Usage:
#   docker compose up -d producer          # Start producer only
#   docker compose up -d                   # Start all services
#   docker compose logs -f producer        # Tail producer logs
#   docker compose down -v                 # Stop and clean up
# =============================================================

services:

  # ─────────────────────────────────────────────
  # Event Producer Service
  # ─────────────────────────────────────────────
  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: ecommerce-producer
    restart: unless-stopped
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - ORDERS_STREAM=${ORDERS_STREAM:-ecommerce-orders-stream}
      - PAYMENTS_STREAM=${PAYMENTS_STREAM:-ecommerce-payments-stream}
      - CLICKSTREAM_STREAM=${CLICKSTREAM_STREAM:-ecommerce-clickstream-stream}
      - CART_STREAM=${CART_STREAM:-ecommerce-cart-stream}
      - EVENTS_PER_SECOND=${EVENTS_PER_SECOND:-50}
      - MAX_CONCURRENT_SESSIONS=${MAX_CONCURRENT_SESSIONS:-200}
      - STREAMING_MODE=${STREAMING_MODE:-multi}
      - MAX_WORKERS=${MAX_WORKERS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - KINESIS_BATCH_SIZE=${KINESIS_BATCH_SIZE:-100}
      - KINESIS_MAX_RETRIES=${KINESIS_MAX_RETRIES:-3}
    volumes:
      - ./logs/producer:/app/logs
    networks:
      - pipeline-network
    healthcheck:
      test: ["CMD", "python", "-c", "import boto3; print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  # ─────────────────────────────────────────────
  # Data Quality Monitor (local)
  # ─────────────────────────────────────────────
  dq-monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor
    container_name: ecommerce-dq-monitor
    restart: unless-stopped
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET:-ecommerce-data-lake}
      - SNS_TOPIC_ARN=${SNS_TOPIC_ARN}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs/monitor:/app/logs
      - ./data_quality:/app/data_quality:ro
    networks:
      - pipeline-network
    depends_on:
      - producer

  # ─────────────────────────────────────────────
  # LocalStack (AWS Local Emulation — DEV ONLY)
  # ─────────────────────────────────────────────
  localstack:
    image: localstack/localstack:latest
    container_name: ecommerce-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"      # LocalStack Gateway
      - "4571:4571"      # Legacy port
    environment:
      - SERVICES=kinesis,s3,lambda,dynamodb,sns,cloudwatch,glue,iam
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - DATA_DIR=/tmp/localstack/data
      - KINESIS_INITIALIZE_STREAMS="ecommerce-orders-stream:4,ecommerce-payments-stream:4,ecommerce-clickstream-stream:4,ecommerce-cart-stream:4,ecommerce-dlq-stream:1"
      - AWS_DEFAULT_REGION=us-east-1
      - HOSTNAME_EXTERNAL=localstack
    volumes:
      - localstack-data:/tmp/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/01_init.sh
    networks:
      - pipeline-network
    profiles:
      - local-dev   # Only start with: docker compose --profile local-dev up

  # ─────────────────────────────────────────────
  # Prometheus (Metrics)
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - pipeline-network
    profiles:
      - monitoring

  # ─────────────────────────────────────────────
  # Grafana (Dashboard)
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - pipeline-network
    depends_on:
      - prometheus
    profiles:
      - monitoring


# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  pipeline-network:
    driver: bridge
    name: ecommerce-pipeline


# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  localstack-data:
    name: ecommerce-localstack-data
  prometheus-data:
    name: ecommerce-prometheus-data
  grafana-data:
    name: ecommerce-grafana-data
